name: Update dashboard data

on:
  schedule:
    - cron: "37 22 * * 1-5"   # after the US close, weekdays
    - cron: "17 11 * * 1-5"   # morning refresh for overnight markets + FRED releases
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-data-v2
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python -u pipeline/fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        timeout-minutes: 15
      - name: Commit refreshed data
        # site/data.json is fully regenerated every run, so it never needs a real merge: rebasing
        # or merging it against a concurrent push just produces spurious conflicts. Instead, rebase
        # our change onto whatever is latest on the branch right before committing, retrying a
        # couple of times in case something else pushes in the same few seconds.
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset "origin/${{ github.ref_name }}"
            git add site/data.json
            git diff --cached --quiet && { echo "no data changes"; break; }
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${{ github.ref_name }}" && break
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
      - run: python pipeline/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        continue-on-error: true   # succeeds once Pages is enabled with source "GitHub Actions"
