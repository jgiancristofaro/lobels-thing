name: Update dashboard data

on:
  # GitHub starts scheduled runs hours late (observed: ~5.5h for the morning slot, ~3h for the
  # evening one), so each cron deliberately fires EARLY and the first step below sleeps until the
  # real target time. If GitHub is later than the target anyway, the wait is skipped.
  #   "15 5 * * 1-5"  -> waits until 11:15 UTC (7:15 AM ET): morning refresh
  #   "3 19 * * 1-5"  -> waits until 22:37 UTC (6:37 PM ET): after the US close
  # If you change a cron string, change the matching entry in the wait step too.
  schedule:
    - cron: "15 5 * * 1-5"
    - cron: "3 19 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

# One group per trigger type. A push cancels an older push run, but must never cancel a scheduled
# run that is sleeping until its target time (that would silently drop the day's refresh), and a
# long sleep must not block push deploys either.
concurrency:
  group: dashboard-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at 6h. Worst case here: 5h wait + ~10 min of work.
    timeout-minutes: 345
    steps:
      # First step, BEFORE checkout, so everything after the wait runs on the code that is on
      # main at the target time rather than a checkout that is hours stale.
      - name: Wait until the target refresh time
        if: github.event_name == 'schedule'
        timeout-minutes: 310
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE" in
            "15 5 * * 1-5") TARGET="11:15" ;;
            "3 19 * * 1-5") TARGET="22:37" ;;
            *) echo "No target time configured for '$SCHEDULE'; not waiting."; exit 0 ;;
          esac
          MAX_WAIT=18000   # 5h: never sleep longer than this
          now=$(date -u +%s)
          target=$(date -u -d "$(date -u +%F) $TARGET:00" +%s)
          remaining=$((target - now))
          echo "Started $(date -u +%H:%M:%S) UTC; target $TARGET UTC; ${remaining}s to go."
          if [ "$remaining" -le 0 ]; then
            echo "Target time already passed (GitHub started this run late); running now."
          elif [ "$remaining" -gt 23400 ]; then
            echo "Target is more than 6.5h away, so this is a stale run for a different day; running now."
          else
            wait=$(( remaining < MAX_WAIT ? remaining : MAX_WAIT ))
            echo "Sleeping ${wait}s until $(date -u -d "@$((now + wait))" +%H:%M:%S) UTC."
            sleep "$wait"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python -u pipeline/fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        timeout-minutes: 15
      - name: Regenerate the written read and trade ideas
        # Only on the scheduled/manual refresh, never on a plain code push - so pushing a
        # hand-edited site/notes.json deploys it immediately instead of it being overwritten
        # seconds later by this same workflow run. continue-on-error: a bad/failed LLM call
        # must never block the data commit or the deploy below; site/notes.json is simply
        # left as whatever was last committed.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -u pipeline/write_notes.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 10
      - name: Commit refreshed data
        # site/data.json and site/notes.json are fully regenerated every run, so they never need
        # a real merge: rebasing or merging them against a concurrent push just produces spurious
        # conflicts. Instead, rebase our change onto whatever is latest on the branch right before
        # committing, retrying a couple of times in case something else pushes in the same window.
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git reset "origin/${{ github.ref_name }}"
            git add site/data.json site/notes.json
            git diff --cached --quiet && { echo "no data changes"; break; }
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${{ github.ref_name }}" && break
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
      - run: python pipeline/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        continue-on-error: true   # succeeds once Pages is enabled with source "GitHub Actions"
