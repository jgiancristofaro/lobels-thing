<title>Macro Tape</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1EF; --surface:#FFFFFF; --surface2:#F6F8F7; --line:#D5DCD8; --grid:#E4E9E6;
  --ink:#15201B; --ink2:#3F4D46; --muted:#6A7771;
  --accent:#1E5A8A; --accent-soft:#DCE8F2;
  --good:#1C7C45; --good-soft:#DDF0E4; --bad:#B8342A; --bad-soft:#F7E0DD; --warn:#9A6414; --warn-soft:#F5EAD4;
  --ma50:#8A6FB0; --ma200:#B07B2E;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1412; --surface:#161E1B; --surface2:#1B2521; --line:#2B3833; --grid:#222D29;
    --ink:#E3EAE6; --ink2:#B6C2BC; --muted:#8A9791;
    --accent:#7AB0DE; --accent-soft:#1D2F3F;
    --good:#4FBF7C; --good-soft:#15301F; --bad:#EE7468; --bad-soft:#3A1C19; --warn:#E0A54A; --warn-soft:#382A13;
    --ma50:#B49BDA; --ma200:#D9A55A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1412; --surface:#161E1B; --surface2:#1B2521; --line:#2B3833; --grid:#222D29;
  --ink:#E3EAE6; --ink2:#B6C2BC; --muted:#8A9791;
  --accent:#7AB0DE; --accent-soft:#1D2F3F;
  --good:#4FBF7C; --good-soft:#15301F; --bad:#EE7468; --bad-soft:#3A1C19; --warn:#E0A54A; --warn-soft:#382A13;
  --ma50:#B49BDA; --ma200:#D9A55A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.01em;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nav a{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink2);text-decoration:none;padding:6px 10px;border-radius:6px;white-space:nowrap}
.nav a:hover{background:var(--surface)}
@media (max-width:640px){.brand small{display:none}.brand{font-size:18px}.nav a{padding:6px 6px;font-size:12.5px}}

/* ---------- hero: regime + read ---------- */
.hero{display:grid;grid-template-columns:300px 1fr;gap:28px;padding-block:24px 8px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:18px}.hero .read{order:-1}}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.gauge .val{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.gauge .lab{font-family:var(--display);font-weight:600;font-size:17px;margin-top:4px}
.gbar{position:relative;height:8px;border-radius:4px;margin:14px 0 6px;background:linear-gradient(90deg,var(--bad) 0%,var(--bad-soft) 35%,var(--surface2) 50%,var(--good-soft) 65%,var(--good) 100%);border:1px solid var(--line)}
.gbar i{position:absolute;top:-5px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pillars{display:grid;gap:7px;margin-top:14px}
.pillar{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.pillar .track{position:relative;height:10px;background:var(--surface2);border-radius:3px}
.pillar .track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line)}
.pillar .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.pillar .v{text-align:right;font-size:12px}
.read h1{font-size:clamp(26px,4.4vw,38px);font-weight:700;margin-top:6px}
.read .summary{font-size:16px;color:var(--ink2);max-width:68ch;margin-top:12px}
.read .summary p{margin:0 0 10px}
.asof{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- sections ---------- */
section{padding-top:28px}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{font-size:24px;font-weight:700}
.sh p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}

/* trades */
.trades{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
@media (max-width:420px){.trades{grid-template-columns:1fr}}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px}
.trade .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dir{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:3px 8px;border-radius:4px}
.dir.long{background:var(--good-soft);color:var(--good)}
.dir.short{background:var(--bad-soft);color:var(--bad)}
.dir.pair{background:var(--accent-soft);color:var(--accent)}
.trade h3{font-size:18px;font-weight:700}
.conv{margin-left:auto;font-size:11px;color:var(--muted);display:flex;gap:3px;align-items:center}
.conv b{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.conv b.on{background:var(--ink2)}
.trade .expr{font-family:var(--mono);font-size:13px;background:var(--surface2);border-radius:6px;padding:7px 9px;color:var(--ink)}
.trade .thesis{margin:0;font-size:14px;color:var(--ink2)}
.trade dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin:0;font-size:13px}
.trade dt{color:var(--muted);font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding-top:1px}
.trade dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip .num{font-size:11.5px}

/* good / bad / flags */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.cols3{grid-template-columns:1fr}}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:0}
.panel li{padding:8px 0;border-top:1px solid var(--grid);font-size:14px}
.panel li:first-child{border-top:0}
.panel li .note{color:var(--ink2)}
.flag{display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer}
.flag .n{font-weight:600}
.flag .m{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.flag .c{font-size:12.5px;text-align:right}
.tag{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:1px}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.up{color:var(--good)} .dn{color:var(--bad)}

/* chart grid */
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:10;background:var(--bg);padding-block:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap;cursor:pointer;font-family:var(--display);font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 input,.row2 select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px}
.row2 input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
@media (max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:8px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
.card:hover{border-color:var(--accent)}
.card .t{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .lv{font-size:13px}
.card .ch{display:flex;gap:8px;font-size:11.5px;flex-wrap:wrap}
.card svg{width:100%;height:54px;display:block}
.state{font-family:var(--display);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;border-radius:3px;white-space:nowrap}
.state.up{background:var(--good-soft);color:var(--good)}
.state.down{background:var(--bad-soft);color:var(--bad)}
.state.turning_up{background:var(--accent-soft);color:var(--accent)}
.state.rolling_over{background:var(--warn-soft);color:var(--warn)}
@media (max-width:560px){.card .ch span:nth-child(3){display:none}.card .nm{font-size:13px}}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,15,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:821px){.sheet{align-items:center}.sheet .box{border-radius:14px}}
.sheet .hd{display:flex;gap:10px;align-items:flex-start}
.sheet h3{font-size:22px;font-weight:700}
.sheet .x{margin-left:auto;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:14px}
.big{width:100%;height:280px;display:block;touch-action:pan-y}
.ranges{display:flex;gap:4px;margin:10px 0 4px}
.ranges button{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:var(--mono)}
.ranges button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px;background:var(--grid);border:1px solid var(--grid);border-radius:8px;overflow:hidden;margin-top:12px}
.stats div{background:var(--surface);padding:7px 9px}
.stats b{display:block;font-family:var(--display);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.why{margin-top:10px;font-size:14px;color:var(--ink2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 7px;border-radius:5px;white-space:nowrap;font-family:var(--mono)}
.foot{margin-top:36px;font-size:12.5px;color:var(--muted);max-width:80ch}
.foot p{margin:0 0 8px}
.err{padding:40px 0;color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.sheet .box{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(16px);opacity:.6}}}
</style>

<header class="top"><div class="in">
  <div class="brand">Macro Tape<small>the Druckenmiller-style daily scan</small></div>
  <nav class="nav">
    <a href="#trades">Trades</a><a href="#goodbad">Good/Bad</a><a href="#flags">Turning</a><a href="#charts">Charts</a>
  </nav>
</div></header>

<main class="wrap" id="app">
  <p class="muted" style="padding-top:30px">Loading the tape…</p>
</main>

<div class="sheet" id="sheet" hidden></div>

<script>
(async function(){
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D, N;
try {
  const [a, b] = await Promise.all([fetch("data.json", {cache:"no-cache"}), fetch("notes.json", {cache:"no-cache"})]);
  D = await a.json();
  N = b.ok ? await b.json() : {};
} catch (e) {
  $("#app").innerHTML = `<p class="err">Could not load data.json. The daily data job may not have run yet.</p>`;
  return;
}
const S = Object.fromEntries(D.series.map(s => [s.id, s]));
const GL = Object.fromEntries(D.groups.map(g => [g.key, g.label]));

// ---------- formatting ----------
function fmtVal(s, x = s.last){
  if (x == null) return "–";
  if (s.unit === "%") return x.toFixed(2) + "%";
  const a = Math.abs(x);
  if (a >= 10000) return x.toLocaleString("en-US", {maximumFractionDigits:0});
  if (a >= 100) return x.toLocaleString("en-US", {maximumFractionDigits:1});
  if (a >= 10) return x.toFixed(2);
  if (a >= 1) return x.toFixed(3);
  return x.toPrecision(3);
}
function fmtChg(s, c){
  if (c == null) return "–";
  if (s.kind === "lvl" && s.unit === "%") return (c >= 0 ? "+" : "−") + Math.abs(c*100).toFixed(0) + "bp";
  if (s.kind === "lvl") return (c >= 0 ? "+" : "−") + Math.abs(c).toFixed(2);
  return (c >= 0 ? "+" : "−") + Math.abs(c).toFixed(1) + "%";
}
// colour a change by what it means for risk assets, not by its sign
function chgClass(s, c){
  if (c == null || !s.pol) return "";
  const v = s.pol * c;
  return v > 0 ? "up" : v < 0 ? "dn" : "";
}
const STATE = {up:"Uptrend", down:"Downtrend", turning_up:"Turning up", rolling_over:"Rolling over"};
const stateHTML = s => `<span class="state ${s}">${STATE[s]}</span>`;
function pts(s){ const t0 = Date.parse(s.t0); return s.dt.map((d,i) => [t0 + d*864e5, s.v[i]]); }

// ---------- sparkline ----------
function spark(s){
  const P = pts(s), end = P[P.length-1][0], from = end - 365*864e5;
  const p = P.filter(q => q[0] >= from && q[1] != null);
  if (p.length < 2) return "";
  const W = 240, H = 54, pad = 3;
  const xs = p.map(q=>q[0]), ys = p.map(q=>q[1]);
  const x0 = xs[0], x1 = xs[xs.length-1], y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => pad + (x-x0)/(x1-x0||1)*(W-2*pad), Y = y => H-pad - (y-y0)/(y1-y0||1)*(H-2*pad);
  const step = Math.max(1, Math.floor(p.length/160));
  const q = p.filter((_,i)=> i%step===0 || i===p.length-1);
  const d = q.map((v,i)=>(i?"L":"M")+X(v[0]).toFixed(1)+" "+Y(v[1]).toFixed(1)).join("");
  const area = d + `L${X(x1).toFixed(1)} ${H}L${X(x0).toFixed(1)} ${H}Z`;
  const cls = chgClass(s, s.chg.m3);
  const col = cls === "up" ? "var(--good)" : cls === "dn" ? "var(--bad)" : "var(--accent)";
  const lx = X(x1), ly = Y(ys[ys.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="${col}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.6" fill="${col}"/></svg>`;
}

// ---------- flags computed from the data ----------
const risky = s => s.pol !== 0;
function line(s, extra=""){
  return `<li class="flag" data-id="${s.id}"><span class="n">${esc(s.name)}${extra}</span>
    <span class="c num">${fmtVal(s)} <span class="${chgClass(s,s.chg.m1)}">${fmtChg(s,s.chg.m1)}</span></span>
    <span class="m">${esc(s.why || GL[s.group])}</span></li>`;
}
const macroGroups = new Set(["liquidity","rates","credit","fx","commod","macro","us","factors"]);
const eqGroups = new Set(["sectors","industries","global","stocks","crypto"]);
function improving(s){ // better for risk over 1m, after a worse 3m: an inflection
  if (!risky(s) || s.chg.m1 == null || s.chg.m3 == null) return 0;
  const m1 = s.pol*s.chg.m1, prior = s.pol*(s.chg.m3 - s.chg.m1);
  return (m1 > 0 && prior < 0) ? (s.z1m ? Math.abs(s.z1m) : 0.5) : 0;
}
function worsening(s){
  if (!risky(s) || s.chg.m1 == null || s.chg.m3 == null) return 0;
  const m1 = s.pol*s.chg.m1, prior = s.pol*(s.chg.m3 - s.chg.m1);
  return (m1 < 0 && prior > 0) ? (s.z1m ? Math.abs(s.z1m) : 0.5) : 0;
}
function flags(){
  const all = D.series;
  const onCome = [
    ...all.filter(s => macroGroups.has(s.group) && (s.state === "turning_up" && s.pol > 0 || s.state === "rolling_over" && s.pol < 0)),
    ...all.filter(s => eqGroups.has(s.group) && s.rs && s.rs.state === "turning_up" && s.rs.chg1m > 0),
    ...all.filter(s => macroGroups.has(s.group) && improving(s) > 0.8),
  ];
  const fading = [
    ...all.filter(s => macroGroups.has(s.group) && (s.state === "rolling_over" && s.pol > 0 || s.state === "turning_up" && s.pol < 0)),
    ...all.filter(s => eqGroups.has(s.group) && s.rs && s.rs.state === "rolling_over" && s.rs.chg1m < 0),
    ...all.filter(s => macroGroups.has(s.group) && worsening(s) > 0.8),
  ];
  const uniq = a => [...new Map(a.map(s=>[s.id,s])).values()];
  const rank = s => Math.abs(s.z1m || 0) + Math.abs(s.rs?.chg1m || 0)/5;
  const accel = all.filter(s => s.accelZ != null && Math.abs(s.accelZ) >= 1.6 && s.group !== "stocks")
    .sort((a,b)=>Math.abs(b.accelZ)-Math.abs(a.accelZ)).slice(0,10);
  return {
    onCome: uniq(onCome).sort((a,b)=>rank(b)-rank(a)).slice(0,10),
    fading: uniq(fading).sort((a,b)=>rank(b)-rank(a)).slice(0,10),
    accel,
  };
}
function accelTag(s){
  const upward = s.accel > 0;
  if (s.pol === 0) {
    if (["WTI","BRENT","GASOLINE","NATGAS","DBC"].includes(s.id) && upward) return `<span class="tag bad">Bad · inflation tax</span>`;
    return `<span class="tag warn">Watch</span>`;
  }
  const good = s.pol * s.accel > 0;
  if (good && s.extZ != null && s.extZ > 2) return `<span class="tag warn">Good, but stretched</span>`;
  return good ? `<span class="tag good">Good</span>` : `<span class="tag bad">Bad</span>`;
}

// ---------- render ----------
const regime = D.regime ?? 0;
const regLabel = regime >= 35 ? "Risk-on" : regime >= 10 ? "Leaning risk-on" : regime > -10 ? "Mixed" : regime > -35 ? "Leaning risk-off" : "Risk-off";
const gen = new Date(D.generated);
const pillarHTML = D.composites.map(c => {
  const v = c.value ?? 0, w = Math.min(50, Math.abs(v)/2);
  const col = v >= 0 ? "var(--good)" : "var(--bad)";
  return `<div class="pillar"><span>${esc(c.label)}</span>
    <span class="track"><span class="fill" style="${v>=0?`left:50%`:`right:50%`};width:${w}%;background:${col}"></span></span>

tabs.innerHTML = [`<button data-g="all" aria-pressed="true">All</button>`, ...D.groups.map(g=>`<button data-g="${g.key}" aria-pressed="false">${esc(g.label)}</button>`)].join("");

try { const g = localStorage.getItem("tape.group"); if (g && (g==="all"||GL[g])) { group = g; tabs.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.g===g)); } } catch {}
$("#q").addEventListener("input", renderGrid);
$("#sort").addEventListener("change", renderGrid);

function renderGrid(){
  const q = $("#q").value.trim().toLowerCase(), sort = $("#sort").value;
  let list = D.series.filter(s => (group === "all" || s.group === group) &&
    (!q || (s.name + " " + s.id + " " + s.sym + " " + (s.why||"") + " " + GL[s.group]).toLowerCase().includes(q)));
  const key = {
    m1: s => Math.abs(s.z1m ?? 0), score: s => s.score ?? -9, "-score": s => -(s.score ?? 9),
    accel: s => Math.abs(s.accelZ ?? 0), rs: s => s.rs?.chg3m ?? -999,
  }[sort];
  if (key) list = [...list].sort((a,b)=>key(b)-key(a));
  $("#grid").innerHTML = list.map(s => `<button class="card" data-id="${s.id}">
    <div class="t"><span class="nm">${esc(s.name)}</span>${stateHTML(s.state)}</div>
    <div class="t"><span class="lv num">${fmtVal(s)}</span><span class="num muted" style="font-size:11px">${s.date.slice(5)}</span></div>
    ${spark(s)}
    <div class="ch num"><span class="${chgClass(s,s.chg.w1)}">1w ${fmtChg(s,s.chg.w1)}</span><span class="${chgClass(s,s.chg.m1)}">1m ${fmtChg(s,s.chg.m1)}</span><span class="${chgClass(s,s.chg.y1)}">1y ${fmtChg(s,s.chg.y1)}</span></div>
  </button>`).join("") || `<p class="muted">Nothing matches.</p>`;
}
renderGrid();

// ---------- detail sheet ----------
const sheet = $("#sheet");
document.addEventListener("click", e => {
  const el = e.target.closest("[data-id]");
  if (el && !sheet.contains(el)) openSheet(el.dataset.id);
});
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest(".x")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
function closeSheet(){ sheet.hidden = true; sheet.innerHTML = ""; document.body.style.overflow = ""; }

function movingAvg(p, days){
  const out = []; let j = 0, sum = 0;
  for (let i = 0; i < p.length; i++){
    sum += p[i][1];
    while (p[j][0] < p[i][0] - days*864e5){ sum -= p[j][1]; j++; }
    out.push([p[i][0], (i - j + 1) >= Math.min(5, days/7) ? sum/(i-j+1) : null]);
  }
  return out;
}
function openSheet(id){
  const s = S[id]; if (!s) return;
  document.body.style.overflow = "hidden";
  const c = s.chg;
  const rs = s.rs ? `<div><b>vs S&P 1m</b><span class="num ${s.rs.chg1m>=0?"up":"dn"}">${s.rs.chg1m>0?"+":""}${s.rs.chg1m}%</span></div>
      <div><b>vs S&P 3m</b><span class="num ${s.rs.chg3m>=0?"up":"dn"}">${s.rs.chg3m>0?"+":""}${s.rs.chg3m}%</span></div>
      <div><b>RS trend</b>${stateHTML(s.rs.state)}</div>` : "";
  sheet.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
    <div class="hd"><div><div class="eyebrow">${esc(GL[s.group])} · ${esc(s.sym || "computed")}</div><h3>${esc(s.name)}</h3>
      <div class="num" style="margin-top:2px">${fmtVal(s)} <span class="${chgClass(s,c.m1)}">${fmtChg(s,c.m1)} 1m</span> ${stateHTML(s.state)}</div></div>
      <button class="x" aria-label="Close">Close</button></div>
    <div class="ranges" id="rg">${["3M","6M","1Y","2Y"].map(r=>`<button data-r="${r}" aria-pressed="${r==="1Y"}">${r}</button>`).join("")}</div>
    <div style="position:relative"><svg class="big" id="big"></svg><div class="tip" id="tip" hidden></div></div>
    <div class="legend"><span style="--c:var(--accent)">${esc(s.name.length>30?s.id:s.name)}</span><span style="--c:var(--ma50)">50-day avg</span><span style="--c:var(--ma200)">200-day avg</span></div>
    <div class="stats">
      <div><b>1 day</b><span class="num ${chgClass(s,c.d1)}">${fmtChg(s,c.d1)}</span></div>
      <div><b>1 week</b><span class="num ${chgClass(s,c.w1)}">${fmtChg(s,c.w1)}</span></div>
      <div><b>1 month</b><span class="num ${chgClass(s,c.m1)}">${fmtChg(s,c.m1)}</span></div>
      <div><b>3 months</b><span class="num ${chgClass(s,c.m3)}">${fmtChg(s,c.m3)}</span></div>
      <div><b>YTD</b><span class="num ${chgClass(s,c.ytd)}">${fmtChg(s,c.ytd)}</span></div>
      <div><b>1 year</b><span class="num ${chgClass(s,c.y1)}">${fmtChg(s,c.y1)}</span></div>
      <div><b>vs 200-day</b><span class="num">${s.ext==null?"–":(s.ext>0?"+":"")+s.ext.toFixed(1)+"%"}</span></div>
      <div><b>52-wk range</b><span class="num">${Math.round((s.pos52??0)*100)}th pct</span></div>
      <div><b>1m move, σ</b><span class="num">${s.z1m ?? "–"}</span></div>
      <div><b>Acceleration, σ</b><span class="num">${s.accelZ ?? "–"}</span></div>
      ${rs}
    </div>
    ${s.why?`<p class="why">${esc(s.why)}.</p>`:""}
    <p class="muted" style="font-size:12px;margin:6px 0 0">Rising is ${s.pol>0?"good":s.pol<0?"bad":"neutral"} for risk assets. Last print ${s.date}.</p>
  </div>`;
  sheet.hidden = false;
  let range = "1Y";
  const draw = () => drawBig(s, range);
  $("#rg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; range = b.dataset.r;
    $("#rg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); draw(); });
  draw();
  $(".x", sheet).focus();
}

function niceTicks(lo, hi, n=4){
  const span = hi - lo || Math.abs(hi) || 1, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(st => span/st <= n) || 10*mag;
  const out = []; for (let v = Math.ceil(lo/step)*step; v <= hi + 1e-9; v += step) out.push(+v.toPrecision(10));
  return out;
}
function drawBig(s, range){
  const svg = $("#big"), tip = $("#tip");
  const W = svg.clientWidth || 600, H = 280, L = 8, R = 58, T = 10, B = 24;
  const days = {"3M":92,"6M":183,"1Y":366,"2Y":731}[range];
  const all = pts(s).filter(q=>q[1]!=null);
  const end = all[all.length-1][0], from = end - days*864e5;
  const ma50 = movingAvg(all, 72).filter(q=>q[0]>=from), ma200 = movingAvg(all, 290).filter(q=>q[0]>=from);
  const p = all.filter(q=>q[0]>=from);
  const ys = [...p.map(q=>q[1]), ...ma50.map(q=>q[1]), ...ma200.map(q=>q[1])].filter(v=>v!=null);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = (y1-y0)*0.06 || 1; y0 -= padY; y1 += padY;
  const x0 = p[0][0], x1 = end;
  const X = x => L + (x-x0)/(x1-x0||1)*(W-L-R), Y = y => T + (1-(y-y0)/(y1-y0))*(H-T-B);
  const path = arr => arr.filter(q=>q[1]!=null).map((q,i)=>(i?"L":"M")+X(q[0]).toFixed(1)+" "+Y(q[1]).toFixed(1)).join("");
  const yt = niceTicks(y0, y1);
  const months = []; const d = new Date(x0); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+1);
  const every = days > 400 ? 4 : days > 200 ? 2 : 1;
  while (d.getTime() <= x1){ if (d.getUTCMonth() % every === 0) months.push(d.getTime()); d.setUTCMonth(d.getUTCMonth()+1); }
  const mfmt = t => { const dd = new Date(t); return dd.getUTCMonth()===0 ? String(dd.getUTCFullYear()) : dd.toLocaleString("en-US",{month:"short",timeZone:"UTC"}); };
  const area = path(p) + `L${X(x1).toFixed(1)} ${H-B}L${X(x0).toFixed(1)} ${H-B}Z`;
  const last = p[p.length-1];
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = `
    ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>
      <text x="${W-R+6}" y="${Y(v)+4}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmtVal(s, v)}</text>`).join("")}
    ${months.map(t=>`<text x="${X(t)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle">${mfmt(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" opacity=".08"/>
    <path d="${path(ma200)}" fill="none" stroke="var(--ma200)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="${path(ma50)}" fill="none" stroke="var(--ma50)" stroke-width="1.5"/>
    <path d="${path(p)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>
    <line id="cx" y1="${T}" y2="${H-B}" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/>
    <circle id="cd" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="hit"/>`;
  const hit = $("#hit", svg), cx = $("#cx", svg), cd = $("#cd", svg);
  const move = ev => {
    const r = svg.getBoundingClientRect(), mx = (ev.clientX - r.left) * (W / r.width);
    const t = x0 + (mx - L)/(W-L-R)*(x1-x0);
    let i = p.findIndex(q=>q[0]>=t); if (i<0) i = p.length-1;
    const q = p[i], px = X(q[0]), py = Y(q[1]);
    cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.setAttribute("visibility","visible");
    cd.setAttribute("cx", px); cd.setAttribute("cy", py); cd.setAttribute("visibility","visible");
    tip.hidden = false;
    tip.textContent = `${new Date(q[0]).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit",timeZone:"UTC"})}  ${fmtVal(s,q[1])}`;
    const tx = px * (r.width / W);
    tip.style.left = Math.min(Math.max(0, tx - tip.offsetWidth/2), r.width - tip.offsetWidth) + "px";
    tip.style.top = "0px";
  };
  const leave = () => { tip.hidden = true; cx.setAttribute("visibility","hidden"); cd.setAttribute("visibility","hidden"); };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move); hit.addEventListener("pointerleave", leave);
}
})();
</script>
